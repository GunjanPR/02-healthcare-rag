[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "healthcare-rag"
version = "0.1.0"
description = "Retrieval-augmented generation for biomedical research over PubMed Central"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Gunjan Rajgure" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "opensearch-py>=2.6",
    "qdrant-client>=1.15",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
# Local cross-encoder reranker (MedCPT). Pulls in torch, so it is not in the Docker image.
# For a GPU, install the CUDA build of torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
rerank = [
    "torch>=2.2",
    "transformers>=4.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["healthcare_rag"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -q --strict-markers -m \"not integration\""
markers = [
    "integration: tests that need running external services (deselect with '-m \"not integration\"')",
]
