name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - run: make lint
      - run: make test

  compose:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Start the stack (API, OpenSearch, Qdrant, Prometheus, Grafana)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke-test the API, backends and monitoring
        run: |
          curl -fs localhost:8010/health
          curl -fs localhost:8010/ready
          curl -fs localhost:8010/metrics | grep -q rag_requests_total
          curl -fs localhost:9200/_cluster/health
          curl -fs localhost:6333/readyz
          curl -fs localhost:9091/-/ready
          curl -fs localhost:3001/api/health
          # /ask with no index built and no gateway must fail cleanly (502/503), not with 500
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8010/ask \
            -H 'Content-Type: application/json' -d '{"question": "what is asthma?"}')
          echo "/ask -> $code"; test "$code" = "502" -o "$code" = "503"
      - name: Integration tests against OpenSearch and Qdrant
        run: |
          make install
          make test-integration
      - name: Retrieval regression gate (BM25 on the toy corpus, no LLM)
        run: python -m healthcare_rag.evaluation gate --min-recall-at-3 0.95 --min-mrr 0.90
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
