name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - run: make lint
      - run: make test

  compose:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke-test the API and backends
        run: |
          curl -fs localhost:8010/health
          curl -fs localhost:8010/ready
          curl -fs localhost:9200/_cluster/health
          curl -fs localhost:6333/readyz
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
